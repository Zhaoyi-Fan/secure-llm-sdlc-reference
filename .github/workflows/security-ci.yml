name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run deterministic security invariants
        run: python -m pytest -q

      - name: Reproduce historical V0 findings safely
        run: python -m scripts.reproduce_v0

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Check out reviewed source triage scanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zhaoyi-Fan/source-code-security-scanner
          ref: 1d136cf93008cdf7002675d086d334607daa3634
          path: .security-tools/source-code-security-scanner
          persist-credentials: false

      - name: Run source-code security triage
        run: >-
          python .security-tools/source-code-security-scanner/vulnscan.py
          -r app
          --fail-on high

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
